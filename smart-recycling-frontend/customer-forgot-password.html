<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - SRMMS</title>

    <link
        rel="stylesheet"
        href="src/style.css">

    <style>

        .reset-message {
            display: none;
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .reset-message.error   { display: block; background: #fdecec; color: #a42626; }
        .reset-message.success { display: block; background: #e7f6ed; color: #1d6b3e; }
        .reset-message.info    { display: block; background: #eef4ff; color: #1e429f; }

        /* hide the steps that are not active (the active step keeps the normal login-form look) */
        .reset-step:not(.active) { display: none; }

        .otp-input {
            text-align: center;
            font-size: 24px;
            letter-spacing: 10px;
            font-weight: 600;
        }

        .reset-links {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 12px;
            font-size: 14px;
        }

        .link-button {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: #2e9e5b;
            cursor: pointer;
        }

        .link-button:hover { text-decoration: underline; }
        .link-button:disabled { color: #9ca3af; cursor: not-allowed; text-decoration: none; }

        .login-submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    </style>

</head>


<body class="login-body">


<div class="login-container">

    <div class="login-card">


        <div class="login-header">

            <h2>Reset Password</h2>

            <p id="stepSubtitle">
                Enter your email to reset your password.
            </p>

        </div>


        <!-- Message box (errors, success, info) -->

        <div
            id="messageBox"
            class="reset-message"
            role="alert"></div>


        <!-- ================= STEP 1: EMAIL ================= -->

        <form
            id="emailForm"
            class="login-form reset-step active">

            <div class="form-group">

                <label for="forgotEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="Enter your email"
                    required>

            </div>

            <button
                type="submit"
                id="sendOtpBtn"
                class="login-submit-btn">

                Send OTP

            </button>

        </form>


        <!-- ================= STEP 2: OTP ================= -->

        <form
            id="otpForm"
            class="login-form reset-step">

            <div class="form-group">

                <label for="otpInput">
                    Enter the 6-digit OTP
                </label>

                <input
                    type="text"
                    id="otpInput"
                    class="otp-input"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    placeholder="------"
                    required>

            </div>

            <button
                type="submit"
                id="verifyOtpBtn"
                class="login-submit-btn">

                Verify OTP

            </button>

            <div class="reset-links">

                <button
                    type="button"
                    id="resendBtn"
                    class="link-button">

                    Resend OTP

                </button>

                <button
                    type="button"
                    id="changeEmailBtn"
                    class="link-button">

                    Change email

                </button>

            </div>

        </form>


        <!-- ================= STEP 3: NEW PASSWORD ================= -->

        <form
            id="passwordForm"
            class="login-form reset-step">

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required>

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required>

            </div>

            <button
                type="submit"
                id="resetBtn"
                class="login-submit-btn">

                Reset Password

            </button>

        </form>


        <!-- BACK TO LOGIN -->

        <div class="register-prompt">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>


        <!-- ECO ILLUSTRATION -->

        <div class="eco-illustration">

            <div class="recycling-scene">


                <div class="character-group">

                    <span class="person person-1">
                        🧍‍♂️
                    </span>

                    <div class="eco-bin bin-green">
                        ♻
                    </div>

                    <div class="eco-bin bin-blue">
                        ♻
                    </div>

                </div>


                <div class="center-recycle-symbol">
                    ♻
                </div>


                <div class="character-group">

                    <div class="eco-bin bin-green">
                        ♻
                    </div>

                    <div class="eco-bin bin-darkgreen">
                        ♻
                    </div>

                    <span class="person person-2">
                        🧍‍♂️
                    </span>

                </div>


            </div>

        </div>


    </div>

</div>


<script>

const API_BASE =
    "http://localhost:8080/api/password-reset";

const RESEND_SECONDS = 30;


// =====================================================
// STATE
// =====================================================

let customerEmail = "";
let resetToken = "";
let resendTimer = null;


// =====================================================
// ELEMENTS
// =====================================================

const messageBox = document.getElementById("messageBox");
const stepSubtitle = document.getElementById("stepSubtitle");

const emailForm = document.getElementById("emailForm");
const otpForm = document.getElementById("otpForm");
const passwordForm = document.getElementById("passwordForm");

const emailInput = document.getElementById("forgotEmail");
const otpInput = document.getElementById("otpInput");
const newPasswordInput = document.getElementById("newPassword");
const confirmPasswordInput = document.getElementById("confirmPassword");

const sendOtpBtn = document.getElementById("sendOtpBtn");
const verifyOtpBtn = document.getElementById("verifyOtpBtn");
const resetBtn = document.getElementById("resetBtn");
const resendBtn = document.getElementById("resendBtn");
const changeEmailBtn = document.getElementById("changeEmailBtn");


// =====================================================
// HELPERS
// =====================================================

function showMessage(text, type) {

    messageBox.textContent = text;
    messageBox.className = "reset-message " + type;

}

function hideMessage() {

    messageBox.textContent = "";
    messageBox.className = "reset-message";

}

function showStep(step) {

    emailForm.classList.remove("active");
    otpForm.classList.remove("active");
    passwordForm.classList.remove("active");

    if (step === 1) {

        emailForm.classList.add("active");
        stepSubtitle.textContent = "Enter your email to reset your password.";

    }

    if (step === 2) {

        otpForm.classList.add("active");
        stepSubtitle.textContent = "Enter the OTP we sent to your email.";

    }

    if (step === 3) {

        passwordForm.classList.add("active");
        stepSubtitle.textContent = "OTP verified. Create your new password.";

    }

}

async function callApi(method, path, body) {

    const response = await fetch(
        API_BASE + path,
        {

            method: method,

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(body)

        }
    );

    let data = {};

    try {
        data = await response.json();
    } catch (error) {
        /* no JSON body */
    }

    return { ok: response.ok, data: data };

}

function startResendTimer() {

    let secondsLeft = RESEND_SECONDS;

    resendBtn.disabled = true;
    resendBtn.textContent = "Resend OTP (" + secondsLeft + "s)";

    clearInterval(resendTimer);

    resendTimer = setInterval(function() {

        secondsLeft--;

        if (secondsLeft <= 0) {

            clearInterval(resendTimer);

            resendBtn.disabled = false;
            resendBtn.textContent = "Resend OTP";

            return;

        }

        resendBtn.textContent = "Resend OTP (" + secondsLeft + "s)";

    }, 1000);

}


// =====================================================
// STEP 1: SEND OTP
// =====================================================

async function sendOtp(isResend) {

    hideMessage();

    const email = emailInput.value.trim();

    if (!email) {

        showMessage("Please enter your email.", "error");

        return;

    }

    sendOtpBtn.disabled = true;
    resendBtn.disabled = true;

    sendOtpBtn.textContent = "Sending OTP...";

    try {

        const result = await callApi(
            "POST",
            "/send-otp",
            { email: email }
        );

        if (!result.ok) {

            showMessage(
                result.data.message || "Could not send the OTP.",
                "error"
            );

            // Keep the resend button usable after an error (unless it was the wait message)
            if (isResend) {
                resendBtn.disabled = false;
            }

            return;

        }

        customerEmail = email;

        otpInput.value = "";

        showStep(2);

        showMessage(
            "OTP sent to " + email + ". Please check your inbox (and spam folder).",
            "info"
        );

        startResendTimer();

        otpInput.focus();

    } catch (error) {

        console.error(error);

        showMessage("Cannot connect to the server.", "error");

        if (isResend) {
            resendBtn.disabled = false;
        }

    } finally {

        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = "Send OTP";

    }

}

emailForm.addEventListener("submit", function(event) {

    event.preventDefault();

    sendOtp(false);

});

resendBtn.addEventListener("click", function() {

    sendOtp(true);

});

changeEmailBtn.addEventListener("click", function() {

    clearInterval(resendTimer);

    customerEmail = "";
    resetToken = "";

    hideMessage();

    showStep(1);

    emailInput.focus();

});


// =====================================================
// STEP 2: VERIFY OTP
// =====================================================

// only digits are allowed in the OTP box
otpInput.addEventListener("input", function() {

    otpInput.value = otpInput.value.replace(/\D/g, "").slice(0, 6);

});

otpForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    hideMessage();

    const otp = otpInput.value.trim();

    if (otp.length !== 6) {

        showMessage("Please enter the 6-digit OTP.", "error");

        return;

    }

    verifyOtpBtn.disabled = true;
    verifyOtpBtn.textContent = "Verifying...";

    try {

        const result = await callApi(
            "POST",
            "/verify-otp",
            {
                email: customerEmail,
                otp: otp
            }
        );

        // Wrong OTP (or expired / too many attempts)
        if (!result.ok) {

            showMessage(
                result.data.message || "Invalid OTP. Please try again.",
                "error"
            );

            otpInput.value = "";
            otpInput.focus();

            return;

        }

        // Correct OTP
        resetToken = result.data.resetToken;

        clearInterval(resendTimer);

        showStep(3);

        showMessage("OTP verified successfully.", "success");

        newPasswordInput.focus();

    } catch (error) {

        console.error(error);

        showMessage("Cannot connect to the server.", "error");

    } finally {

        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = "Verify OTP";

    }

});


// =====================================================
// STEP 3: NEW PASSWORD
// =====================================================

passwordForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    hideMessage();

    const newPassword = newPasswordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (newPassword.length < 6) {

        showMessage("Password must contain at least 6 characters.", "error");

        return;

    }

    if (newPassword !== confirmPassword) {

        showMessage("New password and confirm password do not match.", "error");

        return;

    }

    resetBtn.disabled = true;
    resetBtn.textContent = "Saving...";

    try {

        const result = await callApi(
            "PUT",
            "/reset",
            {
                email: customerEmail,
                resetToken: resetToken,
                newPassword: newPassword,
                confirmPassword: confirmPassword
            }
        );

        if (!result.ok) {

            showMessage(
                result.data.message || "Password reset failed.",
                "error"
            );

            return;

        }

        showMessage(
            "Password reset successfully! Redirecting to login...",
            "success"
        );

        passwordForm.style.display = "none";

        setTimeout(function() {

            window.location.href = "login.html";

        }, 2000);

    } catch (error) {

        console.error(error);

        showMessage("Cannot connect to the server.", "error");

    } finally {

        resetBtn.disabled = false;
        resetBtn.textContent = "Reset Password";

    }

});

</script>


</body>

</html>
