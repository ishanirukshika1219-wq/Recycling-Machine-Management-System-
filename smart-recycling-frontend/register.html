<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SRMMS</title>

    <link rel="stylesheet" href="src/style.css">

    <style>
        .register-message {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        .register-message.success { display: block; background: #e7f6ed; color: #1d6b3e; }
        .register-message.error   { display: block; background: #fdecec; color: #a42626; }
        .register-message a { color: inherit; font-weight: 600; }
        .auth-submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <!-- Header -->
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Join us and start recycling</p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm" class="auth-form">

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                >
            </div>

            <!-- Register -->
            <button
                type="submit"
                class="auth-submit-btn"
                id="registerBtn"
            >
                Register
            </button>

            <!-- Success / error message -->
            <div class="register-message" id="registerMessage" role="status"></div>

        </form>

        <!-- Login -->
        <div class="register-prompt">
            <span>Already have an account?</span>
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script>

const API_BASE = "http://localhost:8080/api";

function showRegisterMessage(html, type) {
    const box = document.getElementById("registerMessage");
    box.innerHTML = html;
    box.className = "register-message " + type;
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
}

document.getElementById("registerForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;

    if (!name || !email || !phone || !password) {
        showRegisterMessage("Please fill in all the fields.", "error");
        return;
    }

    const btn = document.getElementById("registerBtn");
    btn.disabled = true;
    btn.textContent = "Registering...";

    try {

        // The backend saves the customer and automatically emails the customer's address
        const response = await fetch(API_BASE + "/customers/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: name,
                email: email,
                phone: phone,
                password: password
            })
        });

        if (!response.ok) {

            let reason = "Registration failed. Please try again.";

            try {
                const err = await response.json();
                if (err && err.message) reason = err.message;
            } catch (e) { /* ignore */ }

            showRegisterMessage(escapeHtml(reason), "error");
            btn.disabled = false;
            btn.textContent = "Register";
            return;
        }

        showRegisterMessage(
            "Registration successful! A confirmation email is being sent to <strong>" +
            escapeHtml(email) + "</strong>. Redirecting to login...", "success");

        setTimeout(function() {
            window.location.href = "login.html";
        }, 3000);

    } catch (error) {

        console.error("Register error:", error);

        showRegisterMessage(
            "Cannot reach the server. Check that the backend is running.", "error");

        btn.disabled = false;
        btn.textContent = "Register";
    }

});

</script>

</body>
</html>
