<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Forgot Password - SRMMS</title>

  <link
    rel="stylesheet"
    href="src/style.css">

</head>


<body class="login-body">


<div class="login-container">

  <div class="login-card">


    <div class="login-header">

      <h2>Reset Password</h2>

      <p>
        Enter your admin email and create a new password.
      </p>

    </div>


    <form
      id="forgotPasswordForm"
      class="login-form">


      <div class="form-group">

        <label for="forgotEmail">
          Admin Email
        </label>

        <input
          type="email"
          id="forgotEmail"
          placeholder="Enter admin email"
          required>

      </div>


      <div class="form-group">

        <label for="newPassword">
          New Password
        </label>

        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          required>

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Confirm New Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          required>

      </div>


      <button
        type="submit"
        class="login-submit-btn">

        Reset Password

      </button>


      <div class="register-prompt">

        <a href="admin-login.html">
          ← Back to Login
        </a>

      </div>


    </form>


    <div class="eco-illustration">

      <div class="recycling-scene">

        <div class="character-group">

          <span class="person person-1">
            🧍‍♂️
          </span>

          <div class="eco-bin bin-green">
            ♻
          </div>

          <div class="eco-bin bin-blue">
            ♻
          </div>

        </div>


        <div class="center-recycle-symbol">
          ♻
        </div>


        <div class="character-group">

          <div class="eco-bin bin-green">
            ♻
          </div>

          <div class="eco-bin bin-darkgreen">
            ♻
          </div>

          <span class="person person-2">
            🧍‍♂️
          </span>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

const API_BASE =
  "http://localhost:8080/api";


document
  .getElementById("forgotPasswordForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("forgotEmail")
          .value
          .trim();


      const newPassword =
        document
          .getElementById("newPassword")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      if (newPassword !== confirmPassword) {

        alert(
          "New password and confirm password do not match."
        );

        return;
      }


      if (newPassword.length < 6) {

        alert(
          "Password must contain at least 6 characters."
        );

        return;
      }


      try {

        const response =
          await fetch(
            API_BASE + "/admin/forgot-password",
            {

              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                email: email,

                newPassword: newPassword,

                confirmPassword:
                  confirmPassword

              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          alert(
            data.message ||
            "Password reset failed."
          );

          return;
        }


        alert(
          "Password reset successfully! " +
          "You can now login with your new password."
        );


        window.location.href =
          "admin-login.html";

      }

      catch (error) {

        console.error(error);

        alert(
          "Cannot connect to the server."
        );

      }

    }
  );

</script>

</body>
</html>
