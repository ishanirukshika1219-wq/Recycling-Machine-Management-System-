<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SRMMS</title>
  <link rel="stylesheet" href="src/style.css">
</head>

<body class="login-body">

  <div class="login-container">
    <div class="login-card">

      <div class="login-header">
        <h2>Welcome Back!</h2>
        <p>Login to your account</p>
      </div>

      <form id="loginForm" class="login-form">

        <div class="form-group">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>


        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-input-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            >

          </div>
        </div>


        <div class="form-options">

          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Remember me</span>
          </label>

          <a href="forgot-password.html"
             class="forgot-password">
             Forgot password?
          </a>

        </div>


        <button
          type="submit"
          class="login-submit-btn">
          Login
        </button>

      </form>


      


      <div class="eco-illustration">

        <div class="recycling-scene">

          <div class="character-group">

            <span class="person person-1">🧍‍♂️</span>

            <div class="eco-bin bin-green">♻</div>

            <div class="eco-bin bin-blue">♻</div>

          </div>


          <div class="center-recycle-symbol">
            ♻
          </div>


          <div class="character-group">

            <div class="eco-bin bin-green">♻</div>

            <div class="eco-bin bin-darkgreen">♻</div>

            <span class="person person-2">
              🧍‍♂️
            </span>

          </div>

        </div>

      </div>

    </div>
  </div>


<script>

const API_BASE = "http://localhost:8080/api";

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {
      alert("Please enter email and password.");
      return;
    }


    try {

      const response = await fetch(
        API_BASE + "/admin/login",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


      const data = await response.json();


      if (!response.ok) {

        alert(
          data.message ||
          "Invalid email or password."
        );

        return;
      }


      // Save logged-in admin
      localStorage.setItem(
        "admin",
        JSON.stringify(data)
      );


      // Remember email
      if (
        document.getElementById("remember").checked
      ) {

        localStorage.setItem(
          "rememberedAdminEmail",
          email
        );

      } else {

        localStorage.removeItem(
          "rememberedAdminEmail"
        );
      }


      window.location.href =
        "admin-dashboard.html";

    }

    catch (error) {

      console.error(error);

      alert(
        "Cannot connect to the server. " +
        "Please make sure Spring Boot is running."
      );

    }

});


/* Load remembered email */

window.addEventListener("DOMContentLoaded", function() {

  const rememberedEmail =
    localStorage.getItem(
      "rememberedAdminEmail"
    );

  if (rememberedEmail) {

    document.getElementById("email").value =
      rememberedEmail;

    document.getElementById("remember").checked =
      true;

  }

});

</script>

</body>
</html>
