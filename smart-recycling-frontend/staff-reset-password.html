
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Staff Password - SRMMS</title>

    <link rel="stylesheet" href="src/style.css">

    <style>

        .reset-card {
            width: min(92%, 430px);
            margin: 70px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 5px 22px rgba(0,0,0,.12);
        }

        .reset-card h2 {
            margin-top: 0;
        }

        .reset-card .form-group {
            margin: 18px 0;
        }

        .reset-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
        }

        .reset-card button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }

        #resetMessage {
            display: none;
            margin-top: 15px;
        }

    </style>

</head>

<body class="login-body">

<div class="reset-card">

    <h2>Create a new password</h2>

    <p>Enter your new staff account password below.</p>

    <form id="resetForm">

        <div class="form-group">

            <label for="newPassword">New password</label>

            <input
                type="password"
                id="newPassword"
                minlength="8"
                autocomplete="new-password"
                required>

        </div>

        <div class="form-group">

            <label for="confirmPassword">Confirm new password</label>

            <input
                type="password"
                id="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                required>

        </div>

        <button
            type="submit"
            id="resetButton"
            class="login-submit-btn">

            Reset Password

        </button>

    </form>

    <p id="resetMessage" role="alert"></p>

    <p>
        <a href="staff-login.html">Back to Staff Login</a>
    </p>

</div>

<script>

const API_BASE = "http://localhost:8080/api";

const token =
    new URLSearchParams(window.location.search).get("token");

const resetForm = document.getElementById("resetForm");

const resetButton = document.getElementById("resetButton");

const resetMessage = document.getElementById("resetMessage");

function showResetMessage(message, success = false) {

    resetMessage.textContent = message;
    resetMessage.style.display = "block";
    resetMessage.style.color = success ? "green" : "red";
}

if (!token) {

    resetForm.style.display = "none";

    showResetMessage(
        "The reset link is missing or invalid. Please request a new link."
    );
}

resetForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {

        showResetMessage(
            "Password must contain at least 8 characters."
        );

        return;
    }

    if (newPassword !== confirmPassword) {

        showResetMessage("Passwords do not match.");

        return;
    }

    resetButton.disabled = true;
    resetButton.textContent = "Updating...";

    try {

        const response = await fetch(`${API_BASE}/staff/reset-password`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                token: token,
                newPassword: newPassword,
                confirmPassword: confirmPassword
            })

        });

        const data = await response.json();

        showResetMessage(
            data.message || "Unable to reset password.",
            response.ok && data.success
        );

        if (response.ok && data.success) {

            resetForm.reset();
            resetForm.style.display = "none";
        }

    } catch (error) {

        showResetMessage(
            "Cannot connect to the server. Please try again."
        );

        console.error("Password reset error:", error);

    } finally {

        resetButton.disabled = false;
        resetButton.textContent = "Reset Password";
    }

});

</script>

</body>
</html>
